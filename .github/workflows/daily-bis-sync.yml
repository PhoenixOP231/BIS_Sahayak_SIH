name: BIS Sahayak - Automated Daily License Sync

on:
  schedule:
    # Run daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  sync-database:
    name: Sync BIS Nationwide Licenses to Neon PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Daily BIS License ETL Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run sync:bis